[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cora-comp"
version = "0.1.0"
description = "CORA-COMP variant plugin for the comp-eval-platform engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tobias Ladner" }]

dependencies = [
    "comp-eval-platform>=0.1.0",
]

[project.optional-dependencies]
dev = ["comp-eval-platform[dev]"]

[tool.hatch.build.targets.wheel]
packages = ["cora_comp"]

# Local dev: pip install -e ./core -e .   (core is the ./core git submodule)
