<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- CORA-COMP mark: reachable sets growing along a trajectory, in the navbar's red->blue
     gradient. The gradient uses userSpaceOnUse so each set samples the ramp at its own
     position. Mark only — the landing page prints the name beside it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110"
     role="img" aria-label="CORA-COMP">
  <defs>
    <linearGradient id="coraGrad" gradientUnits="userSpaceOnUse" x1="8" y1="94" x2="112" y2="16">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Trajectory the sets are propagated along. -->
  <path d="M 14 86 Q 46 86 63 57 T 108 28" fill="none" stroke="url(#coraGrad)"
        stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>

  <!-- Reachable sets: parallelotopes growing as uncertainty propagates. -->
  <g fill="none" stroke="url(#coraGrad)" stroke-width="3.5" stroke-linejoin="round">
    <path d="M 7 82.5 L 16.8 79 L 21 89.5 L 11.2 93 Z"/>
    <path d="M 25 72.5 L 43 66.5 L 49 84.5 L 31 90.5 Z"/>
    <path d="M 46 48 L 67.2 40.5 L 74 60 L 52.8 67.5 Z"/>
    <path d="M 66 30 L 93.8 20 L 102 55 L 74.2 65 Z"/>
  </g>
</svg>
