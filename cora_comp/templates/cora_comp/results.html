<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — {{ brand }}</title>
<link rel="icon" href="{{ branding.favicon|default:'/api/competition/assets/favicon.png' }}">
<style>
  /* The shell's look, reproduced for this server-rendered page. Colors and the brand
     name are not hardcoded: the view renders in the competition's presentation, the same
     source the React shell boots from, so the two cannot drift on branding. */
  :root {
    --primary: {{ branding.primary_color|default:'#1f2937' }};
    --gradient: {{ branding.navbar_gradient|default:branding.primary_color|default:'#1f2937' }};
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --paper: #ffffff;
    --bg: #f7f8fa;
    --band: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: inherit; }
  .container { max-width: 1536px; margin: 0 auto; padding: 0 24px; }

  /* --- navbar --- */
  .navbar { background: var(--gradient); color: #fff; }
  .navbar .container { display: flex; align-items: center; gap: 16px; padding-top: 20px; padding-bottom: 20px; }
  .brand { font-size: 1.5rem; font-weight: 700; text-decoration: none; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .menu-wrap { position: relative; }
  .menu-btn {
    display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer;
    color: inherit; font: inherit; font-weight: 600; padding: 6px 10px; border-radius: 999px;
  }
  .menu-btn:hover { background: rgba(255,255,255,.12); }
  .menu-btn .glyph { font-size: 1.25rem; line-height: 1; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); min-width: 190px; z-index: 10;
    background: var(--paper); color: var(--ink); border-radius: 10px; padding: 8px 0;
    box-shadow: 0 4px 14px rgba(16,24,40,.14), 0 1px 3px rgba(16,24,40,.08);
  }
  .menu[hidden] { display: none; }
  .menu a, .menu button {
    display: block; width: 100%; text-align: left; padding: 8px 18px; text-decoration: none;
    background: none; border: 0; font: inherit; color: inherit; cursor: pointer;
  }
  .menu a:hover, .menu button:hover { background: #f3f4f6; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

  /* --- page header band + headline accent --- */
  .page-header { background: var(--band); padding: 48px 0; }
  /* The shell's PageBreadcrumbs: a home link, then the current page. */
  .crumbs { display: flex; align-items: center; color: var(--muted); margin-bottom: 24px; }
  .crumbs a { display: flex; align-items: center; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { margin: 0 8px; }
  .crumbs .here { color: var(--ink); }
  .title-row { display: flex; align-items: flex-end; gap: 16px; }
  .page-title { margin: 0; font-size: 3rem; font-weight: 700; letter-spacing: -0.015em; }
  .wave { position: relative; flex: 1; min-width: 24px; height: 5px; margin-bottom: 10px; }
  .wave svg { position: absolute; left: 0; top: 50%; width: 100%; height: 28px; transform: translateY(-50%); overflow: visible; }
  .footer-wave { padding: 40px 0; }
  .footer-wave svg { width: 50%; height: 32px; overflow: visible; display: block; }

  /* --- content --- */
  main { padding-top: 32px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; margin-bottom: 20px; }
  .control label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  select { font: inherit; font-size: .95rem; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-width: 200px; }
  /* The same switch as MUI's on the other pages, in the competition's primary color. */
  .toggle { display: inline-flex; align-items: center; gap: 10px; padding-bottom: 8px; font-size: .95rem; cursor: pointer; user-select: none; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch { position: relative; width: 34px; height: 14px; border-radius: 7px; background: rgba(0, 0, 0, .38); transition: background .15s; flex: none; }
  .switch::after {
    content: ''; position: absolute; top: -3px; left: -3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fafafa; box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.12);
    transition: transform .15s, background .15s;
  }
  .toggle input:checked + .switch { background: color-mix(in srgb, var(--primary) 50%, transparent); }
  .toggle input:checked + .switch::after { transform: translateX(20px); background: var(--primary); }
  .toggle input:focus-visible + .switch::after { outline: 2px solid var(--primary); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .875rem; margin: 12px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; }
  .verdict-finished { color: #2e7d32; }
  .verdict-unsupported { color: var(--muted); }
  .verdict-error, .verdict-timeout, .verdict-prepare_failed { color: #c62828; }
  .scroll { max-height: 560px; overflow: auto; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .filters label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  .filters select, .filters input {
    font: inherit; font-size: .9rem; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; min-width: 170px;
  }
  .pager { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: .875rem; color: var(--muted); }
  .pager button { font: inherit; font-size: .875rem; padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .spacer { flex: 1; }
  /* A run in flight, next to its tool: the page is polling and this row is still growing.
     Same dot as the shell's LiveIndicator — red, 10px, pulsing at 1.2s. */
  .live {
    display: inline-flex; align-items: center; gap: 6px; vertical-align: middle;
    margin-left: 10px; font-size: .875rem; font-weight: 500; color: red; white-space: nowrap;
  }
  .live::before {
    content: ''; display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: red; animation: pulse 1.2s ease-in-out infinite;
    animation-delay: inherit;  /* the phase the marker was rendered with, see pulsePhase() */
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  /* The head of a curve whose run is still going — the same beat as the Live dot, in the
     tool's own color, so the point that is about to move is the one that blinks. */
  .live-head { animation: pulse 1.2s ease-in-out infinite; }
  /* Placeholders until the first payload arrives, like MUI's Skeleton on the other pages. */
  .sk { display: block; background: rgba(0, 0, 0, .11); border-radius: 4px; animation: sk-pulse 2s ease-in-out .5s infinite; }
  .sk-text { height: .9em; margin: 6px 0; }
  .sk-rows { padding-top: 4px; }
  .sk-rows .sk-text { margin: 17px 0; }
  .sk-plot { aspect-ratio: 900 / 480; border-radius: 8px; }
  @keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  #plot { position: relative; }
  #plot svg { width: 100%; height: auto; display: block; }
  .hover-line { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  /* The readout at the hovered rank; it flips to the cursor's left past mid-plot. */
  .plot-tip {
    position: absolute; top: 12px; pointer-events: none; z-index: 2;
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 8px 12px; font-size: .8125rem;
    white-space: nowrap;
  }
  .plot-tip .head { font-weight: 600; margin-bottom: 4px; }
  .plot-tip table { border-collapse: collapse; }
  .plot-tip td { padding: 2px 6px; }
  .plot-tip td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .plot-tip .inst { color: var(--muted); }
  .plot-tip .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .axis { stroke: #9ca3af; stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .axis-label { fill: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }

  footer { margin-top: 48px; padding: 24px 0; text-align: center; background: var(--paper); border-top: 1px solid var(--line); }
  footer p { margin: 0; font-size: .875rem; color: var(--muted); }
</style>
</head>
<body>

<div class="navbar">
  <div class="container">
    <a class="brand" href="/" id="brand">{{ brand }} {{ year }}</a>
    <div class="spacer"></div>
    <div class="menu-wrap">
      <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false">
        <span id="menu-user"></span><span class="glyph">&#926;</span>
      </button>
      <div class="menu" id="menu" hidden></div>
    </div>
  </div>
</div>

<div class="page-header">
  <div class="container">
    <nav class="crumbs" aria-label="breadcrumb">
      <a href="/" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
        aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
      <span class="sep" aria-hidden="true">&rsaquo;</span>
      <span class="here">Results</span>
    </nav>
    <div class="title-row">
      <h1 class="page-title">Results</h1>
      <div class="wave"><svg id="crescendo" viewBox="0 0 300 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    </div>
  </div>
</div>

<main class="container">
  <div class="card">
    <h2>Tools</h2>
    <div id="summary"><div class="sk-rows"><span class="sk sk-text" style="width:100%"></span><span class="sk sk-text" style="width:92%"></span><span class="sk sk-text" style="width:96%"></span></div></div>
  </div>

  <div class="card">
    <h2>Cactus plot</h2>
    <div class="controls">
      <!-- One selector per facet the payload carries; display:contents keeps them in the
           controls row rather than making the wrapper a flex item of its own. -->
      <div id="facets" style="display:contents"><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:200px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:200px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:200px;height:38px;border-radius:10px"></span></div></div>
      <label class="toggle">
        <input type="checkbox" id="subtract-overhead" checked><span class="switch"></span>subtract overhead
      </label>
      <label class="toggle">
        <input type="checkbox" id="include-prepare"><span class="switch"></span>add prepare time
      </label>
      <label class="toggle">
        <input type="checkbox" id="log-scale" checked><span class="switch"></span>log time axis
      </label>
    </div>
    <div id="plot"><span class="sk sk-plot"></span></div>
    <p class="hint" id="plot-hint"></p>
  </div>

  <div class="card">
    <h2>Detailed results</h2>
    <!-- Built once and left alone by redraws, so a live poll cannot steal the focus out
         of the instance box mid-word. -->
    <div class="filters" id="detail-filters"><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:170px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:170px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:170px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:170px;height:38px;border-radius:10px"></span></div><div class="control"><span class="sk sk-text" style="width:64px"></span><span class="sk" style="width:170px;height:38px;border-radius:10px"></span></div></div>
    <div class="scroll"><div id="details"><div class="sk-rows"><span class="sk sk-text" style="width:100%"></span><span class="sk sk-text" style="width:94%"></span><span class="sk sk-text" style="width:97%"></span><span class="sk sk-text" style="width:91%"></span><span class="sk sk-text" style="width:100%"></span><span class="sk sk-text" style="width:94%"></span><span class="sk sk-text" style="width:97%"></span><span class="sk sk-text" style="width:91%"></span></div></div></div>
    <div class="pager" id="detail-pager"></div>
  </div>
</main>

<div class="container footer-wave">
  <svg id="footer-wave" viewBox="0 0 320 32" preserveAspectRatio="none" aria-hidden="true"></svg>
</div>
<footer><div class="container"><p id="copyright">© {{ brand }} {{ year }}. All rights reserved.</p></div></footer>

{{ branding|json_script:"branding" }}
{% verbatim %}
<script>
// CORA's default colors (the MATLAB defaults), as [r,g,b] in 0..1.
const CORA_COLORS = [
  [0.0000, 0.4470, 0.7410],  // blue
  [0.8500, 0.3250, 0.0980],  // red
  [0.9290, 0.6940, 0.1250],  // yellow
  [0.4940, 0.1840, 0.5560],  // purple
  [0.4660, 0.6740, 0.1880],  // green
  [0.3010, 0.7450, 0.9330],  // light blue
  [0.6350, 0.0780, 0.1840],  // dark red
];

const FINISHED = 'finished';
//: The Tools table's verdict columns, in reading order.
const VERDICTS = [FINISHED, 'unsupported', 'error', 'timeout'];
//: Floor of the log axis. The first point of a series is one instance minus the overhead
//: baseline, which can round to zero; without a floor the axis has no bottom.
const Y_FLOOR = 1e-3;

//: How often the page refetches. While a run is in flight the plot is worth watching fill
//: in; otherwise the page only has to notice that one has started.
const POLL_LIVE_MS = 5000;
const POLL_IDLE_MS = 60000;
//: Rows per page of the detail table, and the choices offered.
const PAGE_SIZES = [50, 100, 250, 1000];
const DEFAULT_PAGE_SIZE = 100;

const state = {
  hoverRank: null,  // the cactus rank under the pointer, kept across live redraws
  data: null, filters: {},  // one entry per facet, filled from the payload
  // The default view is the set arithmetic alone: run time, interface overhead removed.
  subtractOverhead: true, includePrepare: false, logScale: true,
  // The detail table's own narrowing, within the page selection: the plot stays where it is.
  details: { tool: 'all', benchmark: 'all', result: 'all', instance: '',
             page: 1, pageSize: DEFAULT_PAGE_SIZE },
};
const el = (id) => document.getElementById(id);
let pollTimer = null;

function esc(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// --- chrome: branding, waves, menu ---------------------------------------

/** The navbar gradient's stops, as the theme parses them (`theme.ts:parseWaveGradient`). */
function gradientStops(css) {
  const inner = (css || '').match(/linear-gradient\(([^)]*)\)/i);
  if (!inner) return null;
  const parts = inner[1].split(',').map((s) => s.trim());
  if (/^[-\d.]+deg$/i.test(parts[0]) || /^to\s/i.test(parts[0])) parts.shift();
  if (parts.length < 2) return null;
  return parts.map((p, i) => {
    const [color, offset] = p.split(/\s+/);
    return { color, offset: offset || `${(i / (parts.length - 1)) * 100}%` };
  });
}

/** The headline accent: flat under the text, breaking into full swings at the far right.
 *  Same geometry as the shell's CrescendoWave. */
function crescendoPath() {
  const W = 300, H = 28, MID = H / 2, FLAT = 0.66, AMP = MID - 2, CYCLES = 9, N = 240;
  let d = '';
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ramp = t <= FLAT ? 0 : (t - FLAT) / (1 - FLAT);
    const a = AMP * ramp * ramp;
    d += `${i === 0 ? 'M' : 'L'}${(t * W).toFixed(2)} ${(MID - a * Math.sin(t * CYCLES * 2 * Math.PI)).toFixed(2)}`;
  }
  return d;
}

/** The closing counterpart: full swings ringing down to a flat line (FooterWave). */
function dampedPath() {
  const W = 320, H = 32, MID = H / 2, AMP = MID - 2, CYCLES = 5, DECAY = 3.2, N = 260;
  let d = '';
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const a = AMP * Math.exp(-DECAY * t);
    d += `${i === 0 ? 'M' : 'L'}${(t * W).toFixed(2)} ${(MID - a * Math.sin(t * CYCLES * 2 * Math.PI)).toFixed(2)}`;
  }
  return d;
}

function paintWave(svg, path, id, stops, width) {
  const defs = stops
    ? `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">${stops
        .map((s) => `<stop offset="${esc(s.offset)}" stop-color="${esc(s.color)}"/>`).join('')}</linearGradient></defs>`
    : '';
  svg.innerHTML = `${defs}<path d="${path}" fill="none" stroke="${stops ? `url(#${id})` : 'currentColor'}"
    stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}

function renderMenu(user) {
  const items = [
    '<a href="/">Home</a>',
    '<a href="/toolkit">Toolkit</a>',
    '<a href="/benchmark">Benchmark</a>',
  ];
  if (user && user.is_admin) items.push('<a href="/admin">Admin</a>');
  items.push('<hr>');
  items.push(user ? '<a href="/account">Account</a>' : '<a href="/login">Log in</a>');
  if (!user) items.push('<a href="/signup">Sign up</a>');
  el('menu').innerHTML = items.join('');
  el('menu-user').textContent = user ? (user.name || user.email) : '';
}

async function bootChrome() {
  // Colors, brand and favicon are rendered in by the view; only the waves are drawn here,
  // before the first await, so they appear with the rest of the first paint.
  const branding = JSON.parse(el('branding').textContent);
  const stops = gradientStops(branding.navbar_gradient);
  const waveColor = stops ? null : (branding.primary_color || '#1f2937');
  for (const svg of [el('crescendo'), el('footer-wave')]) svg.style.color = waveColor || '';
  paintWave(el('crescendo'), crescendoPath(), 'cwave', stops, 5);
  paintWave(el('footer-wave'), dampedPath(), 'fwave', stops, 4);

  let user = null;
  try {
    const res = await fetch('/api/auth/me/', { credentials: 'same-origin' });
    if (res.ok) user = await res.json();
  } catch { /* anonymous */ }
  renderMenu(user);
  const btn = el('menu-btn'), menu = el('menu');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); });
}

// --- colors ---------------------------------------------------------------

function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function rgbToHsl(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min;
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [h / 6, s, l];
}

// A tool takes a CORA color, nudged in hue and lightness by a hash of its name.
function toolColor(name, index) {
  const [r, g, b] = CORA_COLORS[index];
  const [h, s, l] = rgbToHsl(r, g, b);
  const seed = hash(name);
  const hue = (h * 360 + ((seed % 25) - 12) + 360) % 360;
  const light = Math.min(0.72, Math.max(0.28, l + (((seed >> 5) % 13) - 6) / 100));
  return [hue, s * 100, light * 100];
}

//: Saturation and lightness a generated color is drawn from — the band the CORA colors
//: span, so a new one reads as part of the same set.
const EXTRA_SAT = [55, 95], EXTRA_LIGHT = [34, 60];

/** A color for a tool past the end of the palette: several hues drawn from its name, the
 *  one furthest from every hue already given out wins. */
function extraColor(name, taken) {
  let seed = hash(name);
  const draw = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
  let best = 0, bestGap = -1;
  for (let i = 0; i < 16; i++) {
    const hue = draw() * 360;
    const gap = Math.min(...taken.map((t) => {
      const d = Math.abs(hue - t) % 360;
      return Math.min(d, 360 - d);
    }));
    if (gap > bestGap) { bestGap = gap; best = hue; }
  }
  const span = ([lo, hi]) => lo + draw() * (hi - lo);
  return [best, span(EXTRA_SAT), span(EXTRA_LIGHT)];
}

/** Every tool's color, for the tool list as a whole — a generated one depends on the
 *  hues before it, so they cannot be computed one at a time.
 *
 *  The list is ordered by first submission, which fixes a tool's color for good: a filter
 *  cannot shift it, and a tool entered later takes a color of its own instead of
 *  renumbering everyone before it. Past the palette the colors are generated, so the page
 *  never reuses one however many tools enter. */
let palette = { key: null, colors: new Map() };

function paletteOf(tools) {
  const key = JSON.stringify(tools);
  if (palette.key === key) return palette.colors;
  const colors = new Map(), hues = [];
  tools.forEach((name, i) => {
    const [h, s, l] = i < CORA_COLORS.length ? toolColor(name, i) : extraColor(name, hues);
    hues.push(h);
    colors.set(name, `hsl(${h.toFixed(1)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`);
  });
  palette = { key, colors };
  return palette.colors;
}

function colorOf(tool) {
  return paletteOf(state.data.tools).get(tool) || 'currentColor';
}

// --- series ---------------------------------------------------------------

function matches(row) {
  return Object.entries(state.filters).every(([key, value]) =>
    value === 'all' || row.facets[key] === value);
}

// The interface overhead, estimated as the fastest instance the tool ran — the `test`
// benchmark exists to be exactly that. Taken over ALL of a tool's instances, not the
// filtered ones, so changing a selector does not move the baseline under the numbers.
function baselines(rows) {
  const byTool = new Map();
  for (const row of rows) {
    if (!byTool.has(row.tool)) byTool.set(row.tool, { run: Infinity, prepare: Infinity });
    const b = byTool.get(row.tool);
    if (row.result === FINISHED) {
      if (row.time != null) b.run = Math.min(b.run, row.time);
      if (row.prepare_time != null) b.prepare = Math.min(b.prepare, row.prepare_time);
    }
  }
  for (const b of byTool.values()) {
    if (!isFinite(b.run)) b.run = 0;
    if (!isFinite(b.prepare)) b.prepare = 0;
  }
  return byTool;
}

function cost(row, base) {
  const overhead = state.subtractOverhead ? base : { run: 0, prepare: 0 };
  let value = Math.max(0, (row.time ?? 0) - overhead.run);
  if (state.includePrepare) value += Math.max(0, (row.prepare_time ?? 0) - overhead.prepare);
  return value;
}

/** One cactus series per tool: its finished instances sorted by cost, cumulatively summed,
 *  so the curve reaching furthest right at the lowest height is the fastest tool. */
function buildSeries() {
  const all = state.data.measurements;
  const base = baselines(all);
  const byTool = new Map();
  for (const row of all) {
    if (!matches(row) || row.result !== FINISHED) continue;
    if (!byTool.has(row.tool)) byTool.set(row.tool, []);
    byTool.get(row.tool).push({ cost: cost(row, base.get(row.tool)), label: `${row.benchmark} / ${row.instance}` });
  }
  return state.data.tools
    .filter((tool) => byTool.has(tool))
    .map((tool) => {
      const runs = byTool.get(tool).sort((a, b) => a.cost - b.cost);
      let sum = 0;
      const points = runs.map((r, idx) => {
        sum += r.cost;
        return { x: idx + 1, y: sum, cost: r.cost, label: r.label };
      });
      return { tool, color: colorOf(tool), points, total: sum, base: base.get(tool) };
    });
}

// --- plot -----------------------------------------------------------------

function niceTicksLog(lo, hi) {
  const ticks = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) ticks.push(10 ** e);
  return ticks.filter((t) => t >= lo * 0.999 && t <= hi * 1.001);
}

function niceTicksLinear(hi, count) {
  const step = Math.max(1, Math.ceil(hi / count));
  const ticks = [];
  for (let v = 0; v <= hi; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] !== hi) ticks.push(hi);
  return ticks;
}

/** Round steps (1, 2 or 5 times a power of ten) from 0 to the first one at or above `hi`. */
function niceTicksTime(hi, count) {
  const raw = hi / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((f) => f * mag).find((v) => v >= raw);
  const ticks = [];
  for (let i = 0; i <= Math.ceil(hi / step - 1e-9); i++) ticks.push(i * step);
  return { ticks, step };
}

/** Every measured time, always to two decimals: a column of them lines up, and the eye
 *  compares digits instead of formats. Anything under 5 ms therefore reads 0.00. */
function fmtTime(v) {
  return v == null ? '' : v.toFixed(2);
}

/** Hover values span microseconds to hours, so they keep three significant digits. */
function fmtHover(v) {
  return v >= 100 ? v.toFixed(0) : v.toPrecision(3);
}

/** Axis labels are round values, not measurements, so 0.001 must not read as 0.00. */
function fmtTick(v, step) {
  if (step !== undefined) return v.toFixed(Math.max(0, -Math.floor(Math.log10(step))));
  return v >= 1 ? v.toFixed(0) : String(v);
}

function renderPlot(series) {
  const host = el('plot'), hint = el('plot-hint');
  if (!series.length) {
    host.innerHTML = '<p class="empty">No finished instances for this selection.</p>';
    hint.textContent = '';
    return;
  }

  const W = 900, H = 480, M = { top: 16, right: 24, bottom: 48, left: 68 };
  const xMax = Math.max(...series.map((s) => s.points.length));
  const yValues = series.flatMap((s) => s.points.map((p) => p.y)).filter((v) => v > 0);
  const log = state.logScale;
  let yMin, yMax, yTicks, yStep;
  if (log) {
    yMin = Math.max(Y_FLOOR, Math.min(...yValues, 1));
    yMax = Math.max(...yValues, yMin * 10);
    yTicks = niceTicksLog(yMin, yMax);
  } else {
    ({ ticks: yTicks, step: yStep } = niceTicksTime(Math.max(...yValues, Y_FLOOR), 6));
    yMin = 0;
    yMax = yTicks[yTicks.length - 1];
  }

  const px = (x) => M.left + (x / Math.max(1, xMax)) * (W - M.left - M.right);
  const py = (y) => {
    const t = log
      ? (Math.log10(Math.max(y, yMin)) - Math.log10(yMin)) / (Math.log10(yMax) - Math.log10(yMin) || 1)
      : Math.max(y, 0) / yMax;
    return H - M.bottom - t * (H - M.top - M.bottom);
  };

  const parts = [`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cactus plot">`];
  for (const t of yTicks) {
    parts.push(`<line class="grid" x1="${M.left}" y1="${py(t)}" x2="${W - M.right}" y2="${py(t)}"/>`);
    parts.push(`<text class="tick" x="${M.left - 8}" y="${py(t) + 4}" text-anchor="end">${fmtTick(t, yStep)}</text>`);
  }
  for (const t of niceTicksLinear(xMax, 10)) {
    parts.push(`<line class="grid" x1="${px(t)}" y1="${M.top}" x2="${px(t)}" y2="${H - M.bottom}"/>`);
    parts.push(`<text class="tick" x="${px(t)}" y="${H - M.bottom + 18}" text-anchor="middle">${t}</text>`);
  }
  parts.push(`<line class="axis" x1="${M.left}" y1="${M.top}" x2="${M.left}" y2="${H - M.bottom}"/>`);
  parts.push(`<line class="axis" x1="${M.left}" y1="${H - M.bottom}" x2="${W - M.right}" y2="${H - M.bottom}"/>`);
  parts.push(`<text class="axis-label" x="${(M.left + W - M.right) / 2}" y="${H - 10}" text-anchor="middle">instances finished (sorted by cost)</text>`);
  parts.push(`<text class="axis-label" transform="translate(16 ${(M.top + H - M.bottom) / 2}) rotate(-90)" text-anchor="middle">cumulative time (s${log ? ', log' : ''})</text>`);

  for (const s of series) {
    const d = s.points.map((p, i) => `${i ? 'L' : 'M'}${px(p.x).toFixed(1)} ${py(p.y).toFixed(1)}`).join(' ');
    parts.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`);
    const last = s.points[s.points.length - 1];
    // The curve's head pulses while the run is in flight — it is the point that moves.
    const live = isLive(s.tool);
    parts.push(`<circle class="${live ? 'live-head' : ''}" style="${live ? pulsePhase() : ''}" `
      + `cx="${px(last.x).toFixed(1)}" cy="${py(last.y).toFixed(1)}" r="3.5" fill="${s.color}"/>`);
  }
  parts.push('<g id="plot-hover"></g>');
  // Transparent, on top: it receives the pointer over the whole plotting area.
  parts.push(`<rect id="plot-hit" x="${M.left}" y="${M.top}" width="${W - M.left - M.right}" `
    + `height="${H - M.top - M.bottom}" fill="transparent"/>`);
  parts.push('</svg>');
  host.innerHTML = parts.join('') + '<div class="plot-tip" id="plot-tip" hidden></div>';

  const svg = host.querySelector('svg');
  const hit = el('plot-hit');
  const toRank = (ev) => {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
    const rank = Math.round(((x - M.left) / (W - M.left - M.right)) * Math.max(1, xMax));
    return Math.min(xMax, Math.max(1, rank));
  };
  hit.addEventListener('mousemove', (ev) => { state.hoverRank = toRank(ev); showHover(); });
  hit.addEventListener('mouseleave', () => { state.hoverRank = null; showHover(); });

  function showHover() {
    const layer = el('plot-hover'), tip = el('plot-tip');
    const k = state.hoverRank;
    if (k == null || k > xMax) { layer.innerHTML = ''; tip.hidden = true; return; }
    const at = series.map((s) => ({ s, p: s.points[k - 1] }));
    const marks = [`<line class="hover-line" x1="${px(k)}" y1="${M.top}" x2="${px(k)}" y2="${H - M.bottom}"/>`];
    for (const { s, p } of at) {
      if (p) marks.push(`<circle cx="${px(p.x)}" cy="${py(p.y)}" r="4.5" fill="${s.color}" stroke="var(--paper)" stroke-width="1.5"/>`);
    }
    layer.innerHTML = marks.join('');
    // Stacked the way the curves are, so the eye goes from a line straight to its row and
    // the best tool is at the bottom of both. Ordering by the total is what does it: the
    // total is the curve's height here. A tool whose run ends before this rank is above
    // every curve that reaches it — it never got this far — and those are ranked among
    // themselves the way the plot ranks everything: instances finished first, then the
    // total they cost.
    const byStack = (a, b) => {
      if (a.p && b.p) return b.p.y - a.p.y;
      if (a.p || b.p) return a.p ? 1 : -1;
      return a.s.points.length - b.s.points.length || b.s.total - a.s.total;
    };
    const rows = at.slice().sort(byStack)
      .map(({ s, p }) => `<tr><td><span class="sw" style="background:${s.color}"></span>${esc(s.tool)}</td>`
        + (p
          ? `<td class="num">${fmtHover(p.y)} s</td><td class="num">+${fmtHover(p.cost)} s</td><td class="inst">${esc(p.label)}</td>`
          : `<td class="num">—</td><td class="num"></td><td class="inst">finished only ${s.points.length}</td>`)
        + '</tr>')
      .join('');
    tip.innerHTML = `<div class="head">Instance #${k} (sorted by cost)</div>`
      + `<table><tr class="inst"><td></td><td class="num">total</td><td class="num">this one</td><td></td></tr>${rows}</table>`;
    tip.hidden = false;
    // Positioned in CSS pixels of the rendered plot, which is scaled from the viewBox.
    const scale = svg.getBoundingClientRect().width / W;
    const x = px(k) * scale;
    const right = px(k) > (M.left + W - M.right) / 2;
    tip.style.left = right ? `${Math.max(0, x - tip.offsetWidth - 12)}px` : `${x + 12}px`;
  }
  showHover();

  hint.textContent = 'Further right and lower is better: more instances finished for less '
    + 'total time. Plotting run time'
    + (state.includePrepare ? ' plus prepare time' : '')
    + (state.subtractOverhead
      ? ', with each tool’s own overhead — its fastest instance — subtracted from every '
        + 'measurement.'
      : ', overhead included.');
}

// --- tables ---------------------------------------------------------------

function isLive(tool) {
  return (state.data.running || []).includes(tool);
}

/** Where in the 1.2s pulse the clock is, as a negative delay. A poll replaces these
 *  elements, and a fresh element would otherwise restart its animation — every live
 *  marker on the page instead picks the beat back up where the last one left off. */
function pulsePhase() {
  return `animation-delay:${-(Date.now() % 1200) / 1000}s`;
}

/** The marker on a tool whose run has not finished — its numbers are still moving. */
function liveTag(tool) {
  return isLive(tool)
    ? `<span class="live" style="${pulsePhase()}" title="run in flight">Live</span>` : '';
}

/** Per tool, how many of the selected instances ended in each verdict; the harness's
 *  prepare_failed, like anything unrecognized, counts as an error. */
function verdictCounts() {
  const byTool = new Map();
  for (const row of state.data.measurements) {
    if (!matches(row)) continue;
    if (!byTool.has(row.tool)) byTool.set(row.tool, Object.fromEntries(VERDICTS.map((v) => [v, 0])));
    byTool.get(row.tool)[VERDICTS.includes(row.result) ? row.result : 'error'] += 1;
  }
  return byTool;
}

function renderSummary(series) {
  const host = el('summary');
  const counts = verdictCounts();
  const bySeries = new Map(series.map((s) => [s.tool, s]));
  // A tool that has just started has no results yet; list it anyway, so the run is visible
  // from its first second rather than from its first result.
  const tools = state.data.tools.filter((t) => counts.has(t) || isLive(t));
  if (!tools.length) {
    host.innerHTML = '<p class="empty">Nothing measured yet.</p>';
    return;
  }
  // Time only covers finished instances, so a tool with none has no time to show.
  const rows = tools.map((tool) => {
    const c = counts.get(tool);
    const s = bySeries.get(tool);
    return `<tr>
      <td><span class="swatch" style="background:${colorOf(tool)}"></span>${esc(tool)}${liveTag(tool)}</td>
      ${VERDICTS.map((v) => `<td class="num">${c ? c[v] : 0}</td>`).join('')}
      <td class="num">${s ? fmtTime(s.total) : '—'}</td>
      <td class="num">${s ? fmtTime(s.base.run) : '—'}</td>
      <td class="num">${s ? fmtTime(s.base.prepare) : '—'}</td>
    </tr>`;
  }).join('');
  host.innerHTML = `<table><thead><tr>
      <th>Tool</th>${VERDICTS.map((v) => `<th class="num">${esc(v[0].toUpperCase() + v.slice(1))}</th>`).join('')}
      <th class="num">Time, finished (s)</th>
      <th class="num">Overhead (run, s)</th><th class="num">Overhead (prepare, s)</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/** The rows the detail table shows: the page selection, narrowed by its own filters. */
function detailRows() {
  const d = state.details;
  const needle = d.instance.trim().toLowerCase();
  const rows = state.data.measurements.filter((r) => matches(r)
    && (d.tool === 'all' || r.tool === d.tool)
    && (d.benchmark === 'all' || r.benchmark === d.benchmark)
    && (d.result === 'all' || r.result === d.result)
    && (!needle || r.instance.toLowerCase().includes(needle)));
  rows.sort((a, b) => a.benchmark.localeCompare(b.benchmark)
    || a.instance.localeCompare(b.instance) || a.tool.localeCompare(b.tool));
  return rows;
}

function renderDetails() {
  const host = el('details'), scroller = host.parentElement, top = scroller.scrollTop;
  const base = baselines(state.data.measurements);
  const rows = detailRows();
  const pageSize = state.details.pageSize;
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  // A filter that shortens the table, or a poll on the last page, must not leave the view
  // past the end.
  state.details.page = Math.min(Math.max(1, state.details.page), pages);
  const from = (state.details.page - 1) * pageSize;
  const page = rows.slice(from, from + pageSize);

  if (!rows.length) {
    host.innerHTML = '<p class="empty">No instances match this selection.</p>';
  } else {
    const body = page.map((r) => `<tr>
        <td>${esc(r.tool)}</td>
        <td>${esc(r.benchmark)}</td>
        <td>${esc(r.instance)}</td>
        <td class="verdict-${esc(r.result || 'unknown')}">${esc(r.result)}</td>
        <td class="num">${fmtTime(r.prepare_time)}</td>
        <td class="num">${fmtTime(r.time)}</td>
        <td class="num">${r.result === FINISHED ? fmtTime(cost(r, base.get(r.tool))) : ''}</td>
      </tr>`).join('');
    host.innerHTML = `<table><thead><tr>
        <th>Tool</th><th>Benchmark</th><th>Instance</th><th>Result</th>
        <th class="num">Prepare (s)</th><th class="num">Run (s)</th><th class="num">Adjusted (s)</th>
      </tr></thead><tbody>${body}</tbody></table>`;
  }
  renderPager(rows.length, from, page.length, pages);
  scroller.scrollTop = top;  // a poll must not yank the table back to the top
}

function renderPager(total, from, shown, pages) {
  const page = state.details.page;
  el('detail-pager').innerHTML = total
    ? `<span>${from + 1}–${from + shown} of ${total}</span>
       <span class="spacer"></span>
       <button id="page-prev" ${page <= 1 ? 'disabled' : ''}>Previous</button>
       <span>Page ${page} of ${pages}</span>
       <button id="page-next" ${page >= pages ? 'disabled' : ''}>Next</button>`
    : '';
  const step = (delta) => { state.details.page += delta; renderDetails(); };
  if (el('page-prev')) el('page-prev').addEventListener('click', () => step(-1));
  if (el('page-next')) el('page-next').addEventListener('click', () => step(1));
}

/** "all" plus a facet's own values, under the catalog's groups where the facet has them. */
function optionsMarkup(facet) {
  const option = (o) => `<option value="${esc(o)}">${esc(o)}</option>`;
  const body = facet.groups
    ? facet.groups.map((g) =>
        `<optgroup label="${esc(g.label)}">${g.options.map(option).join('')}</optgroup>`).join('')
    : facet.options.map(option).join('');
  return option('all') + body;
}

/** Replace a selector's options, keeping the selection where it still exists. */
function setOptions(select, facet, selected) {
  const markup = optionsMarkup(facet);
  if (select.innerHTML === markup) return selected;  // untouched, so an open dropdown stays open
  select.innerHTML = markup;
  select.value = facet.options.includes(selected) ? selected : 'all';
  return select.value;
}

/** The options come from the data, so a run that adds a tool, a benchmark or a verdict
 *  shows up in the filters without a code change — and without touching the text box. The
 *  benchmark selector carries the catalog's groups, the same as the one above the plot. */
function syncDetailFilters() {
  const benchmarks = state.data.facets.find((f) => f.key === 'benchmark') || { options: [] };
  const verdicts = [...new Set(state.data.measurements.map((r) => r.result).filter(Boolean))].sort();
  const d = state.details;
  d.tool = setOptions(el('detail-tool'), { options: state.data.tools }, d.tool);
  d.benchmark = setOptions(el('detail-benchmark'), benchmarks, d.benchmark);
  d.result = setOptions(el('detail-result'), { options: verdicts }, d.result);
}

/** The detail filters, built once: one per column of the table that is not a time. They
 *  narrow the table alone — the benchmark selector at the top of the page moves the plot
 *  with it, which is not what reading through one benchmark's rows calls for. */
function buildDetailFilters() {
  const option = (o) => `<option value="${esc(o)}">${esc(o)}</option>`;
  el('detail-filters').innerHTML = `
    <div><label for="detail-tool">Tool</label>
      <select id="detail-tool"></select></div>
    <div><label for="detail-benchmark">Benchmark</label>
      <select id="detail-benchmark"></select></div>
    <div><label for="detail-instance">Instance contains</label>
      <input id="detail-instance" type="search" placeholder="e.g. matMul-500d"></div>
    <div><label for="detail-result">Result</label>
      <select id="detail-result"></select></div>
    <div><label for="detail-page-size">Rows per page</label>
      <select id="detail-page-size">${PAGE_SIZES.map(option).join('')}</select></div>`;
  el('detail-page-size').value = String(state.details.pageSize);
  syncDetailFilters();

  // Any change starts over at page 1: page 7 of the old filter means nothing under the new.
  const onChange = (id, key, transform = (v) => v) => el(id).addEventListener('input', (e) => {
    state.details[key] = transform(e.target.value);
    state.details.page = 1;
    renderDetails();
  });
  onChange('detail-tool', 'tool');
  onChange('detail-benchmark', 'benchmark');
  onChange('detail-instance', 'instance');
  onChange('detail-result', 'result');
  onChange('detail-page-size', 'pageSize', Number);
}

// --- wiring ---------------------------------------------------------------

function draw() {
  const series = buildSeries();
  renderPlot(series);
  renderSummary(series);
  renderDetails();
}

/** A selector per facet the payload carries, so a facet added server-side needs no markup
 *  here. Selecting "all" on the device facet is what plots cpu and gpu together. Rebuilt
 *  only when the options themselves change, so a poll leaves the selection alone. */
function syncFacetSelectors() {
  const markup = state.data.facets.map((facet) => `<div class="control">
        <label for="facet-${esc(facet.key)}">${esc(facet.label)}</label>
        <select id="facet-${esc(facet.key)}">${optionsMarkup(facet)}</select>
      </div>`).join('');
  const host = el('facets');
  if (host.innerHTML === markup) return;
  host.innerHTML = markup;
  for (const facet of state.data.facets) {
    const select = el(`facet-${facet.key}`);
    select.value = facet.options.includes(state.filters[facet.key]) ? state.filters[facet.key] : 'all';
    state.filters[facet.key] = select.value;
    select.addEventListener('change', () => { state.filters[facet.key] = select.value; draw(); });
  }
}

function bindToggles() {
  el('subtract-overhead').addEventListener('change', (e) => {
    state.subtractOverhead = e.target.checked;
    draw();
  });
  el('include-prepare').addEventListener('change', (e) => {
    state.includePrepare = e.target.checked;
    draw();
  });
  el('log-scale').addEventListener('change', (e) => {
    state.logScale = e.target.checked;
    draw();
  });
}

// --- polling --------------------------------------------------------------

async function refresh() {
  const res = await fetch('/api/cora/results/data/', { credentials: 'same-origin' });
  if (!res.ok) return false;
  state.data = await res.json();
  syncFacetSelectors();
  syncDetailFilters();
  draw();
  return true;
}

function schedulePoll() {
  clearTimeout(pollTimer);
  const live = (state.data.running || []).length;
  pollTimer = setTimeout(poll, live ? POLL_LIVE_MS : POLL_IDLE_MS);
}

async function poll() {
  // A hidden tab still reschedules, so coming back finds a page that is only one interval
  // stale rather than one that stopped following the run.
  if (!document.hidden) await refresh();
  schedulePoll();
}

/** Swaps the loading placeholders for a message when no payload is coming. */
function showUnavailable(message) {
  for (const id of ['facets', 'summary', 'details', 'detail-filters']) el(id).innerHTML = '';
  el('plot').innerHTML = `<p class="empty">${message}</p>`;
}

async function boot() {
  await bootChrome();
  const res = await fetch('/api/cora/results/data/', { credentials: 'same-origin' });
  if (!res.ok) {
    showUnavailable('Could not load results.');
    return;
  }
  state.data = await res.json();
  for (const facet of state.data.facets) state.filters[facet.key] = 'all';
  syncFacetSelectors();
  bindToggles();
  buildDetailFilters();
  draw();

  schedulePoll();
  // Returning to the tab should not wait out the interval that elapsed while it was hidden.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}

boot();
</script>
